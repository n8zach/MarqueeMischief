<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
       <img class="marquee-banner" src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/MainBanner.JPG') }}" alt="Marquee Mischief">
        <section class="panel home-panel">
            {% if current_user.is_authenticated %}
                <nav class="action-list" aria-label="Marquee Mischief activities">
                    <a class="action-card" href="{{ url_for('daily_game') }}">
                        <img src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/evil.png') }}" alt="Mischievous character">
                        <span>Today's Mischief</span>
                    </a>
                    <a class="action-card" href="{{ url_for('daily_vote') }}">
                        <img src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/laughingcolor.jfif') }}" alt="Laughing face">
                        <span>Vote on Yesterday's Mischief</span>
                    </a>
                    <a class="action-card" href="{{ url_for('daily_results') }}">
                        <img src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/Laughing.jfif') }}" alt="Laughing face">
                        <span>Check out the Daily Winners</span>
                    </a>
                    <hr class="action-separator">
                    <a class="action-card" href="{{ url_for('tryit') }}">
                        <img src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/friendly.jfif') }}" alt="Friendly face">
                        <span>Make Your Own Mischief</span>
                    </a>
                    <a class="action-card" href="{{ url_for('create_game') }}">
                        <img src="{{ url_for('static', filename='images/' ~ config['IMAGE_DIRECTORY'] ~ '/dancing.jfif') }}" alt="Dancing figure">
                        <span>Start A New Game</span>
                    </a>
                </nav>
            {% else %}
                <p class="intro">A little wordplay, a little spectacle, and plenty of mischief.</p>
                <div class="account-actions">
                    <a class="button" href="{{ url_for('login') }}">Log in</a>
                    <a class="button gold" href="{{ url_for('register') }}">Register</a>
                </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
