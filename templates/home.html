<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
       <img class="marquee-banner" src="{{ url_for('static', filename='images/MainBanner.JPG') }}" alt="Marquee Mischief">
        <section class="panel home-panel">
            {% if current_user.is_authenticated %}
                <nav class="action-list" aria-label="Marquee Mischief activities">
                    <a class="action-card" href="{{ url_for('tryit') }}">
                        <img src="{{ url_for('static', filename='images/friendly.jfif') }}" alt="Friendly face">
                        <span>Try It</span>
                    </a>
                    <a class="action-card" href="{{ url_for('create_game') }}">
                        <img src="{{ url_for('static', filename='images/dancing.jfif') }}" alt="Dancing figure">
                        <span>New Game</span>
                    </a>
                    <a class="action-card" href="{{ url_for('daily_game') }}">
                        <img src="{{ url_for('static', filename='images/evil.png') }}" alt="Mischievous character">
                        <span>Today's Mischief</span>
                    </a>
                    <a class="action-card" href="{{ url_for('daily_vote') }}">
                        <img src="{{ url_for('static', filename='images/laughingcolor.jfif') }}" alt="Laughing face">
                        <span>Vote On Yesterday's Mischief</span>
                    </a>
                    <a class="action-card" href="{{ url_for('daily_results') }}">
                        <img src="{{ url_for('static', filename='images/Laughing.jfif') }}" alt="Laughing face">
                        <span>Check out the winners</span>
                    </a>
                </nav>
            {% else %}
                <p class="intro">A little wordplay, a little spectacle, and plenty of mischief.</p>
                <div class="account-actions">
                    <a class="button" href="{{ url_for('login') }}">Log in</a>
                    <a class="button gold" href="{{ url_for('register') }}">Register</a>
                </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
