<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for game — Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
        <section class="panel center">
            <h1 class="page-title">The marquee is warming up</h1>
            <p class="page-lede">Waiting for the game master to start the game.</p>
            <p id="waitingStatus" aria-live="polite">This page will begin automatically when the game starts.</p>
        </section>
    </main>
    <script>
        const statusUrl = {{ url_for('game_status', game_id=game.id)|tojson }};
        async function checkGameStatus() {
            try {
                const status = await (await fetch(statusUrl, {cache: "no-store"})).json();
                if (status.started) window.location.reload();
            } catch (_) {
                document.getElementById("waitingStatus").textContent = "Still waiting for the game to start.";
            }
        }
        checkGameStatus();
        window.setInterval(checkGameStatus, 5000);
    </script>
</body>
</html>
