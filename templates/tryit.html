<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            appearance: none;
            font-size: 20px;
            text-align: center;
            font-family: 'Helvetica ', sans-serif;
        }

        #marqee-message {
            text-align: center;
            margin: 20px;
        }

        #customForm {
            text-align: center;
            margin: 20px;
        }

        .tryItBox {
            box-sizing: border-box;
            margin: auto;
            min-height: 100px;
            padding: 12px;
            width: min(75%, 42rem);
            font-family: "3606-marquee-web", sans-serif;
            font-size: clamp(14px, 4vw, 32px);
            font-weight: 900;
            line-height: 1.1;
            text-align: center;
            color: #142327;
            background-color: #fff;
            border: 3px solid #8e1717;
            border-radius: 2px;
        }

        .unavailable-letter {
            color: #c00;
        }

        .unusedLetters {
            text-align: center;
            align-items: center;
        }

        .suggestsions {
            text-align: center;
            align-items: center;
        }

        .helpLabel {
            font-size: .7em;
            text-align: center;
            align-items: center;
            font-family: 'Helvetica ', sans-serif;
        }

        .aiWaiting {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }      

        #scrollBox {
            height: 200px; /* Set the desired height for the scroll box */
            overflow: auto;
            background-color: #9fc5df; /* a dark color */
        }

        .drafts {
            font-size: 15px;
        }

    </style>
</head>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="/static/JavaScript/cookies.js"></script>
    <script src="/static/JavaScript/textChangeNFade.js"></script>

    Hello {{ current_user.username }}
    <br>
    <br>
    {{ form_data['OriginalMessageDisplay'] | safe }}
    <br>
    <div id="tryItHereLable" class = "helpLabel">Make your own message here from the letters in the Original Message.</div>
    
    <div id="tryItBox" class = "tryItBox" contenteditable="true" data-original-message="{{ form_data['OriginalMessage'] }}" data-best="{{ form_data['Best'] }}"></div><button id="clearTryItBox" onclick="clearTryItBox()">X</button>
   <button id="saveDraft" onclick="addDraftItem(document.getElementById('tryItBox').textContent)">Save Draft</button>
   
    <br>
    Unused Letters: <button onclick="clickScrambleUnusedLetters()">scramble</button><div id="unusedLetters" class = "unusedLetters"></div>
    <br>
    <div id="wordSuggestions" class = "suggestions"></div>
    <br>
    <button id="getAiSuggestions" onclick="updateAISuggestions()">Get AI Suggestions</button>
    <div class="aiWaiting" id="aiWaiting"></div>
    <div id="scrollBox">
        <div id="aiSuggestions" class = "suggestions"></div>
    </div>
    <p></p>
    <div class="body">Drafts</div>
    <div class="drafts" id="drafts"></div>
    <br>      
    <label for="tryAnotherPuzzleSelect">Try a different one:</label>
    <select id="tryAnotherPuzzleSelect" data-tryit-url="{{ url_for('tryit') }}" onchange="navigateToTryAnotherPuzzle(this)">
        <option value="" selected disabled>Choose an original message</option>
        {% for puzzle in puzzles %}
            <option value="{{ puzzle[1] }}">{{ puzzle[1] }}</option>
        {% endfor %}
    </select>

    <script src="/static/JavaScript/marqueemischief.js"></script>
</body>


</html>
