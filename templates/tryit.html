<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Try It — Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
        <section class="panel play-layout">
            <div class="field">
                <label for="tryAnotherPuzzleSelect">Choose your original message</label>
                {% set current = form_data['OriginalMessage'] %}
                <select id="tryAnotherPuzzleSelect">{% if current not in puzzles | map(attribute=1) | map('upper') | list %}<option value="{{ current }}" selected>{{ current }}</option>{% endif %}{% for puzzle in puzzles %}<option value="{{ puzzle[1] }}"{% if puzzle[1] | upper == current %} selected{% endif %}>{{ puzzle[1] }}</option>{% endfor %}</select>
            </div>
            <div class="field"><label for="tryItNewMessage">Or type your own original message</label><input id="tryItNewMessage" maxlength="256" autocomplete="off"></div>
            <div class="marquee-stage">
                {{ form_data['OriginalMessageDisplay'] | safe }}
                <div class="letter-actions"><button id="clearTryItBox" type="button" onclick="clearTryItBox()" aria-label="Reset message">Reset</button><button type="button" onclick="clickScrambleOriginalMessage()">Scramble</button><button id="saveDraft" class="gold" type="button" onclick="addDraftItem(document.getElementById('tryItBox').textContent)">Save draft</button></div>
            </div>
            <div class="composer">
                <div class="composer-stage">{{ form_data['TryItBoxDisplay'] | safe }}</div>

            </div>
            <div class="saved-drafts" hidden><p class="help-label">Saved drafts</p><p class="help-label" data-hint="draft"><i>click a draft to move it to your marquee</i></p><div class="drafts" id="drafts"></div></div>
            <div id="wordSuggestions" class="suggestion-box"></div>
            <div>
                <div class="button-row"><button id="getAiSuggestions" type="button" onclick="updateAISuggestions()">Get AI suggestions</button></div>
                <div class="aiWaiting" id="aiWaiting"></div>
                <div id="scrollBox" class="suggestion-box"><div id="aiSuggestions"></div></div>
            </div>
        </section>
        <p class="reset-help"><a href="#" onclick="resetHelp(); return false;">reset help</a></p>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='JavaScript/cookies.js') }}"></script>
    <script src="{{ url_for('static', filename='JavaScript/textChangeNFade.js') }}"></script>
    <script src="{{ url_for('static', filename='JavaScript/marqueemischief.js') }}"></script>
    <script>
        (() => {
            const input = document.getElementById("tryItNewMessage");
            const selector = document.getElementById("tryAnotherPuzzleSelect");

            function applyMessage(message) {
                if (!message.trim()) return;
                setTryItOriginalMessage(message);
                const url = new URL(window.location.href);
                url.searchParams.set("OriginalMessage", message);
                window.history.replaceState(null, "", url);
            }

            function onInput() {
                applyMessage(input.value.length > 0 ? input.value : selector.value);
            }

            function onSelectionChange() {
                input.value = "";
                applyMessage(selector.value);
            }

            input.addEventListener("input", onInput);
            selector.addEventListener("change", onSelectionChange);
        })();
    </script>
</body>
</html>
