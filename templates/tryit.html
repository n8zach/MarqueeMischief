<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try It — Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
        <section class="panel play-layout">
            <div>
                <h1 class="page-title">Time to Make Mischief</h1>
                <p class="player-greeting">Hello {{ current_user.username }} — rearrange the letters and see what mischief appears.</p>
            </div>
            <div class="marquee-stage">{{ form_data['OriginalMessageDisplay'] | safe }}</div>
            <div>
                <p class="help-label">Unused letters</p>
                <div id="unusedLetters" class="letter-bank"></div>
                <div class="letter-actions"><button type="button" onclick="clickScrambleUnusedLetters()">Scramble</button></div>
            </div>
            <div class="composer">
                <div id="tryItBox" class="tryItBox" contenteditable="true" role="textbox" aria-label="Your new message" data-original-message="{{ form_data['OriginalMessage'] }}" data-best="{{ form_data['Best'] }}"></div>
                <div class="composer-actions"><button id="clearTryItBox" type="button" onclick="clearTryItBox()" aria-label="Clear message">Clear</button><button id="saveDraft" class="gold" type="button" onclick="addDraftItem(document.getElementById('tryItBox').textContent)">Save draft</button></div>
            </div>
            <div class="saved-drafts"><p class="help-label">Saved drafts</p><div class="drafts" id="drafts"></div></div>
            <div id="wordSuggestions" class="suggestion-box"></div>
            <div>
                <div class="button-row"><button id="getAiSuggestions" type="button" onclick="updateAISuggestions()">Get AI suggestions</button></div>
                <div class="aiWaiting" id="aiWaiting"></div>
                <div id="scrollBox" class="suggestion-box"><div id="aiSuggestions"></div></div>
            </div>
            <div class="field">
                <label for="tryAnotherPuzzleSelect">Try a different original message</label>
                <select id="tryAnotherPuzzleSelect" data-tryit-url="{{ url_for('tryit') }}" onchange="navigateToTryAnotherPuzzle(this)"><option value="" selected disabled>Choose an original message</option>{% for puzzle in puzzles %}<option value="{{ puzzle[1] }}">{{ puzzle[1] }}</option>{% endfor %}</select>
            </div>
        </section>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='JavaScript/cookies.js') }}"></script>
    <script src="{{ url_for('static', filename='JavaScript/textChangeNFade.js') }}"></script>
    <script src="{{ url_for('static', filename='JavaScript/marqueemischief.js') }}"></script>
</body>
</html>
