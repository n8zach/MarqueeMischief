<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
        <section class="panel">
            <h1 class="page-title">Welcome back</h1>
            <p class="page-lede">Sign in and start making a little marquee mischief.</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}<ul class="notice-list">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
            {% endwith %}
            <form class="form-stack" method="post">
                <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required></div>
                <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
                <input type="hidden" name="next_url" value="{{ request.args.get('next', '') }}">
                <input class="gold" type="submit" value="Log in">
            </form>
            <p class="center">New here? <a class="text-link" href="{{ url_for('register', next=request.args.get('next', '')) }}">Create an account</a>.</p>
        </section>
    </main>
</body>
</html>
