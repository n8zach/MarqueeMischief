<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Marquee Mischief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marquee.css') }}">
</head>
<body>
    <main class="site-shell">
        {% include '_site_nav.html' %}
        <section class="panel">
            <h1 class="page-title">Join the mischief</h1>
            <p class="page-lede">Pick a username and get ready to turn messages inside out.</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}<ul class="notice-list">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
            {% endwith %}
            <form class="form-stack" method="post">
                <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required></div>
                <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" required></div>
                <div class="field"><label for="authorization_code">Authorization code</label><input type="text" id="authorization_code" name="authorization_code" required></div>
                <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">
                <input class="gold" type="submit" value="Register">
            </form>
            <p class="center">Already playing? <a class="text-link" href="{{ url_for('login', next=request.values.get('next', '')) }}">Log in</a>.</p>
        </section>
    </main>
</body>
</html>
