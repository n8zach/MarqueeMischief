<header class="site-header">
    <div class="site-identity">
        <a class="brand" href="{{ url_for('default') }}">Marquee Mischief</a>
        {% if current_user.is_authenticated %}
            <span class="current-user" title="Signed in as {{ current_user.username }}">{{ current_user.username }}</span>
        {% endif %}
    </div>
    <nav class="site-nav" aria-label="Primary navigation">
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('tryit') }}">Try It</a>
            <a href="{{ url_for('create_game') }}">New Game</a>
            <a href="{{ url_for('results') }}">Results</a>
            {% if current_user.isAdministrator %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
            <a href="{{ url_for('logout') }}">Log out</a>
        {% else %}
            <a href="{{ url_for('login') }}">Log in</a>
            <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
    </nav>
</header>
